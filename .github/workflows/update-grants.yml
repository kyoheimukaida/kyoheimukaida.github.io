name: Update grants

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 08:35 JST.
    - cron: "35 8 * * 1"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  update-grants:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update grants page from public KAKENHI/manual data
        run: |
          python scripts/update_grants.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add grants.md
          git add cv.md
          git add _data/grants.json
          git add generated/grants.tex

          if ! git diff --quiet -- _data/grants_manual.json; then
            git add _data/grants_manual.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update grants page"
            git pull --rebase
            git push
          fi
